<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Library Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../vendor/katex.min.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="app-shell">
    <div class="workspace-area">
      <div id="translateWorkspace">

  <!-- Language Selector -->
  <div class="lang-bar">
    <div class="lang-select-wrap">
      <label for="sourceLang">From</label>
      <select id="sourceLang">
        <option value="auto" selected>Auto Detect</option>
        <option value="EN">English</option>
        <option value="JA">日本語</option>
        <option value="DE">Deutsch</option>
        <option value="FR">Français</option>
        <option value="ES">Español</option>
        <option value="IT">Italiano</option>
        <option value="NL">Nederlands</option>
        <option value="PL">Polski</option>
        <option value="PT">Português</option>
        <option value="RU">Русский</option>
        <option value="ZH">中文</option>
        <option value="KO">한국어</option>
      </select>
    </div>
    <button id="swapLangsBtn" class="swap-btn" title="Swap languages">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M7 16l-4-4 4-4"/>
        <path d="M17 8l4 4-4 4"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
      </svg>
    </button>
    <div class="lang-select-wrap">
      <label for="targetLang">To</label>
      <select id="targetLang">
        <option value="JA" selected>日本語</option>
        <option value="EN-US">English (US)</option>
        <option value="EN-GB">English (UK)</option>
        <option value="DE">Deutsch</option>
        <option value="FR">Français</option>
        <option value="ES">Español</option>
        <option value="IT">Italiano</option>
        <option value="NL">Nederlands</option>
        <option value="PL">Polski</option>
        <option value="PT-BR">Português (BR)</option>
        <option value="PT-PT">Português (PT)</option>
        <option value="RU">Русский</option>
        <option value="ZH-HANS">中文（簡体）</option>
        <option value="ZH-HANT">中文（繁体）</option>
        <option value="KO">한국어</option>
      </select>
    </div>
      </div>

  <!-- Source Text -->
  <div class="card source-card">
    <div class="card-header">
      <span class="card-label">Original</span>
      <div class="card-actions">
        <button id="clearBtn" class="small-btn" title="Clear">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </div>
    <textarea id="sourceText" placeholder="Select text on any webpage, or type here..." rows="5"></textarea>
    <div class="card-footer">
      <span id="charCount" class="char-count">0 chars</span>
      <button id="translateBtn" class="translate-btn">
        <span class="btn-text">Translate</span>
        <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Translation Result -->
  <div class="card result-card">
    <div class="card-header">
      <span class="card-label">Translation</span>
      <span id="detectedLang" class="detected-lang"></span>
      <div class="card-actions">
        <button id="copyBtn" class="small-btn" title="Copy translation">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>
    </div>
    <div id="resultText" class="result-text">
      <span class="placeholder-text">Translation will appear here...</span>
    </div>
    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="loading-indicator hidden">
      <div class="loading-dots">
        <span></span><span></span><span></span>
      </div>
      <span class="loading-text">Translating...</span>
    </div>
    <!-- Error Display -->
    <div id="errorDisplay" class="error-display hidden"></div>
  </div>

  <!-- Auto-translate Toggle -->
  <div class="options-bar">
    <label class="toggle-label" for="autoTranslate">
      <span>Auto-translate on selection</span>
      <div class="toggle-switch">
        <input type="checkbox" id="autoTranslate" checked>
        <span class="toggle-slider"></span>
      </div>
    </label>
  </div>

  </div>

      <div id="aiWorkspace" class="hidden">
    <div class="ai-toolbar">
      <button id="aiHistoryBtn" class="toolbar-btn" type="button">履歴</button>
      <button id="aiNewChatBtn" class="toolbar-btn toolbar-btn-primary" type="button">新しいチャット</button>
    </div>

    <div id="aiThreadPanel" class="thread-panel hidden">
      <div class="thread-panel-header">スレッド一覧</div>
      <div id="aiThreadList" class="thread-list"></div>
    </div>

    <div id="aiMessages" class="ai-messages">
      <div class="ai-msg ai-msg-assistant">
        <div class="ai-msg-body">質問を入力してください。現在は雛形のため、スタブ応答を返します。</div>
      </div>
    </div>

    <div class="ai-input-dock">
      <div class="ai-input-shell">
        <textarea id="aiPromptInput" rows="3" placeholder="Ask follow-up, summarize, explain, or rewrite..."></textarea>
        <button id="aiSendBtn" class="ai-send-btn" title="Send message" aria-label="Send message">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 2L11 13"/>
            <path d="M22 2L15 22L11 13L2 9L22 2Z"/>
          </svg>
        </button>
      </div>
    </div>
      </div>

      <div id="notesWorkspace" class="hidden">
    <div id="notesLayout" class="notes-layout">
      <aside class="notes-sidebar">
        <button id="notesNewBtn" class="notes-new-btn notes-new-btn-top" type="button">+ 新規作成</button>

        <div class="notes-section">
          <button id="notesPageSectionToggle" class="notes-section-toggle" type="button" aria-expanded="true">
            <span>このページのメモ</span>
            <span class="notes-section-caret">▾</span>
          </button>
          <div id="notesPageSectionBody" class="notes-section-body">
            <div id="notesPageList" class="notes-list"></div>
          </div>
        </div>

        <div class="notes-section">
          <button id="notesAllSectionToggle" class="notes-section-toggle" type="button" aria-expanded="true">
            <span>すべてのメモ</span>
            <span class="notes-section-caret">▾</span>
          </button>
          <div id="notesAllSectionBody" class="notes-section-body">
            <div id="notesAllList" class="notes-list"></div>
          </div>
        </div>
      </aside>

      <section id="notesEditorWrap" class="notes-editor-wrap">
        <div class="notes-editor-actions">
          <button id="notesBackBtn" class="toolbar-btn" type="button">← 戻る</button>
          <button id="notesInsertSelectionBtn" class="toolbar-btn" type="button">選択テキスト引用</button>
        </div>

        <div class="notes-field-group">
          <label for="notesTagsInput" class="notes-field-label">Tags (comma separated)</label>
          <input id="notesTagsInput" class="notes-tags-input" type="text" placeholder="research, summary, todo">
        </div>

        <div id="notesSheet" class="notes-pane notes-sheet">
          <div id="notesSheetTitle" class="notes-pane-title">Preview</div>
          <textarea id="notesMarkdownInput" class="notes-markdown-input hidden" placeholder="# Notes\n\nWrite your note here..."></textarea>
          <div id="notesPreview" class="notes-preview"></div>
        </div>

        <div id="notesStatus" class="notes-status"></div>
      </section>
    </div>
      </div>

      <div id="markersWorkspace" class="hidden">
    <div class="markers-layout">
      <div class="markers-toolbar">
        <button id="markersRefreshBtn" class="toolbar-btn" type="button">再読み込み</button>
      </div>

      <div class="markers-section">
        <div class="markers-section-title">このページのマーカー</div>
        <div id="markersList" class="markers-list"></div>
      </div>

      <div id="markersStatus" class="notes-status"></div>
    </div>
      </div>

      <div id="libraryWorkspace" class="hidden">
    <div class="library-layout">
      <div class="library-toolbar">
        <button id="libraryCreateFolderBtn" class="library-create-folder-btn" type="button" title="フォルダを新規作成" aria-label="フォルダを新規作成">＋</button>
        <input id="librarySearchInput" class="library-search-input" type="search" placeholder="タイトル・URL・メモで検索">
      </div>
      <div id="libraryExplorer" class="library-explorer"></div>
      <div id="libraryStatus" class="notes-status"></div>
      <div id="libraryTrash" class="library-entry library-trash-row" data-entry-type="trash">
        <div class="library-entry-main">
          <span class="library-entry-sub">🗑</span>
          <div class="library-entry-name">ゴミ箱（ここにドロップで削除）</div>
        </div>
      </div>
    </div>
      </div>
    </div>

    <aside id="actionRail" class="action-rail" role="toolbar" aria-label="Workspace actions">
      <button
        id="settingsBtn"
        class="icon-btn mode-btn rail-btn"
        type="button"
        data-action-id="settings"
        draggable="true"
        title="設定"
        aria-label="設定"
      >
        <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="12" cy="12" r="3.2"></circle>
          <path d="M19.4 15a1 1 0 0 0 .2 1.1l.1.1a1.8 1.8 0 1 1-2.5 2.5l-.1-.1a1 1 0 0 0-1.1-.2 1 1 0 0 0-.6.9V20a1.8 1.8 0 1 1-3.6 0v-.2a1 1 0 0 0-.6-.9 1 1 0 0 0-1.1.2l-.1.1a1.8 1.8 0 1 1-2.5-2.5l.1-.1a1 1 0 0 0 .2-1.1 1 1 0 0 0-.9-.6H4a1.8 1.8 0 1 1 0-3.6h.2a1 1 0 0 0 .9-.6 1 1 0 0 0-.2-1.1l-.1-.1a1.8 1.8 0 1 1 2.5-2.5l.1.1a1 1 0 0 0 1.1.2h.1a1 1 0 0 0 .5-.9V4a1.8 1.8 0 1 1 3.6 0v.2a1 1 0 0 0 .6.9 1 1 0 0 0 1.1-.2l.1-.1a1.8 1.8 0 1 1 2.5 2.5l-.1.1a1 1 0 0 0-.2 1.1v.1a1 1 0 0 0 .9.5H20a1.8 1.8 0 1 1 0 3.6h-.2a1 1 0 0 0-.9.6Z"></path>
        </svg>
      </button>

      <button
        id="modeTranslateBtn"
        class="mode-btn rail-btn active"
        type="button"
        data-action-id="translate"
        draggable="true"
        title="Translate"
        aria-label="Translate"
        aria-pressed="true"
      >
        <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="12" cy="12" r="8"></circle>
          <path d="M4 12h16"></path>
          <path d="M12 4a12 12 0 0 1 0 16"></path>
          <path d="M12 4a12 12 0 0 0 0 16"></path>
        </svg>
      </button>
      <button
        id="modeAiBtn"
        class="mode-btn rail-btn"
        type="button"
        data-action-id="ai"
        draggable="true"
        title="Ask AI"
        aria-label="Ask AI"
        aria-pressed="false"
      >
        <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <rect x="6" y="8" width="12" height="10" rx="3"></rect>
          <path d="M9 8V6a3 3 0 0 1 6 0v2"></path>
          <circle cx="10" cy="13" r="1"></circle>
          <circle cx="14" cy="13" r="1"></circle>
          <path d="M10 16h4"></path>
        </svg>
      </button>
      <button
        id="modeNotesBtn"
        class="mode-btn rail-btn"
        type="button"
        data-action-id="notes"
        draggable="true"
        title="Notes"
        aria-label="Notes"
        aria-pressed="false"
      >
        <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M7 4h8l3 3v13H7z"></path>
          <path d="M15 4v3h3"></path>
          <path d="M10 11h5"></path>
          <path d="M10 14h5"></path>
        </svg>
      </button>
      <button
        id="modeMarkersBtn"
        class="mode-btn rail-btn"
        type="button"
        data-action-id="markers"
        draggable="true"
        title="Markers"
        aria-label="Markers"
        aria-pressed="false"
      >
        <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M6 16l8-8 4 4-8 8H6z"></path>
          <path d="M14 8l2-2 4 4-2 2"></path>
          <path d="M6 16l-2 4 4-2"></path>
        </svg>
      </button>
      <button
        id="modeLibraryBtn"
        class="mode-btn rail-btn"
        type="button"
        data-action-id="library"
        draggable="true"
        title="Library"
        aria-label="Library"
        aria-pressed="false"
      >
        <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M6 5h4v14H6z"></path>
          <path d="M10 5h5v14h-5"></path>
          <path d="M15 7h3v12h-3"></path>
        </svg>
      </button>
    </aside>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2>Settings</h2>
        <button id="closeModalBtn" class="icon-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="apiKeyInput">DeepL API Key</label>
          <div class="api-key-input-wrap">
            <input type="password" id="apiKeyInput" placeholder="Enter your DeepL API key">
            <button id="toggleKeyVisibility" class="icon-btn" title="Toggle visibility">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="apiTypeSelect">API Plan</label>
          <select id="apiTypeSelect">
            <option value="free" selected>Free</option>
            <option value="pro">Pro</option>
          </select>
        </div>
        <p class="help-text">
          Get your API key from 
          <a href="https://www.deepl.com/pro#developer" target="_blank" rel="noopener">deepl.com/pro</a>
        </p>

        <hr class="settings-divider">

        <div class="form-group">
          <label for="aiProviderSelect">AI Provider</label>
          <select id="aiProviderSelect">
            <option value="openai" selected>OpenAI</option>
            <option value="anthropic">Anthropic</option>
            <option value="gemini">Google Gemini</option>
          </select>
        </div>

        <div class="form-group">
          <label for="aiApiKeyInput">AI API Key</label>
          <input type="password" id="aiApiKeyInput" placeholder="Enter API key for selected provider">
        </div>

        <div class="form-group">
          <label for="aiModelSelect">AI Model</label>
          <select id="aiModelSelect"></select>
        </div>

        <p id="aiModelHelp" class="help-text"></p>
      </div>
      <div class="modal-footer">
        <button id="saveSettingsBtn" class="primary-btn">Save</button>
      </div>
    </div>
  </div>

  <script src="../../../vendor/katex.min.js"></script>
  <script src="../../../vendor/markdown-it.min.js"></script>
  <script src="../../../vendor/markdown-it-multimd-table.min.js"></script>
  <script src="../../ai/sidepanel/ai-chat.js"></script>
  <script src="../../notes/sidepanel/note-panel.js"></script>
  <script src="../../marker/sidepanel/marker-panel.js"></script>
  <script src="../../library/sidepanel/library-panel.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
